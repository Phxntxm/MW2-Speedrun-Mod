name: Compile FF files
on:
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45.0.3
        with:
          diff_relative: true
          path: ff/source
      - name: Compile FF files
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          echo "Compiling FF files..."
          echo "Changed files: ${ALL_CHANGED_FILES}"
          python scripts/compiler.py ${ALL_CHANGED_FILES}
          echo "Done compiling FF files"
      # patch.ff has no folder in ff/source: the timer's clock menu is built into it by a script
      - name: Get changed clock menu files
        id: clock-menu
        uses: tj-actions/changed-files@v45.0.3
        with:
          files: |
            scripts/build_clock_menu.py
            ff/files/patch.ff
      - name: Build clock menu into patch.ff
        if: steps.clock-menu.outputs.any_changed == 'true'
        run: python scripts/build_clock_menu.py ff/files/patch.ff
      - name: Commit FF files
        if: steps.changed-files.outputs.any_changed == 'true' || steps.clock-menu.outputs.any_changed == 'true'
        uses: EndBug/add-and-commit@v9
        with:
          message: "Compile FF files"
          add: "ff/files/*"
